version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - conformance
    - e2e

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes:
        - G103 # unsafe.String for zero-alloc topic/payload aliasing; isolated to wire/unsafe.go and contract-documented
        - G104 # `_ = m.Ack()` is intentional throughout (manual-ack contract)
        - G115 # bounded uint16 packet IDs trip integer-overflow false positives
        - G118 # supervisor + decode goroutines are client-lifetime, not request-scoped — context.Background is correct
        - G304 # file-backed store paths are root-rebased by the caller's Config
        - G306 # store/file already uses 0o600 / 0o700; gosec misreads MkdirAll
        - G404 # reconnect-backoff jitter is not cryptographically sensitive; math/rand/v2 is the right choice
        - G602 # VBI decoder bounds-checks before indexing; gosec doesn't track the guard
    revive:
      rules:
        - name: var-naming
          disabled: false
        - name: package-comments
          disabled: false
        - name: exported
          disabled: false
          arguments:
            - checkPrivateReceivers # methods on unexported receivers
            - sayRepetitiveInsteadOfStutters
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - govet
        # revive's var-naming complains about test helpers like
        # pubQoS0_autopaho / pubQoS0_mqttv5 that deliberately use a
        # `_lib` suffix as a paired-naming convention.
      - path: _test\.go
        linters:
          - revive
        text: "var-naming:.*underscores"
      - path: benchmarks/
        linters:
          - errcheck
          - gosec
      - path: examples/
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ashtonian/mqttv5
