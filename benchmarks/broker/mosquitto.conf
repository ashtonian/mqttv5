# Broker for the end-to-end benchmarks. Defaults are kept except where a
# default would make the broker drop messages a benchmark counts on.

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Never drop queued QoS 0/1/2 messages for an online subscriber: a
# throughput run that loses messages measures nothing. The default
# (1000) drops once a subscriber falls that far behind.
max_queued_messages 0

# Kept at the default (20): the in-flight window towards a subscriber
# that does not advertise a Receive Maximum (MQTT 3.1.1 clients) and the
# Receive Maximum the broker grants publishers.
max_inflight_messages 20

# Sessions resumed by the reconnect benchmark.
persistent_client_expiration 1h

# Benchmarks open many short connections; keep the broker's own logging
# out of the measurement.
connection_messages false
log_type error
