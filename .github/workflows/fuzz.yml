name: fuzz

# Nightly fuzzing of the wire codec. Each target runs for FUZZ_TIME; a
# crashing input is uploaded as an artifact (and lands in
# wire/testdata/fuzz/<Target>/ locally when reproduced) so it can be added
# as a regression seed.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # The oldest Go minor go.mod accepts, at its newest patch: what a
  # supported user builds with, standard-library security fixes included.
  # govulncheck checks the standard library of the Go that runs it.
  GO_VERSION: '1.27.x'
  FUZZ_TIME: 10m

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-mqttv5
    strategy:
      fail-fast: false
      matrix:
        target:
          - FuzzReadPacket
          - FuzzProperties
          - FuzzDecodeVarint
          - FuzzPublishRoundTrip
          - FuzzValidUTF8
          - FuzzScanTopicName
    steps:
      - uses: actions/checkout@v7

      - uses: ashtonian/go-ci-actions@470279e1ff775269324ca13b0aaaf7211951215e # v1.0.1
        with:
          workload: ${{ toJSON(matrix) }}
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go test -fuzz
        run: go test ./wire/ -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime ${{ env.FUZZ_TIME }}

      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: wire/testdata/fuzz/
