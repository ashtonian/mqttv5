name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  validate:
    name: validate tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet and go test -race (every module)
        run: |
          for m in . codec/json codec/msgpack store/file queue/file internal/filedb transport/ws examples benchmarks; do
            echo "::group::$m"
            (cd "$m" && go vet ./... && go test -race -timeout 5m -count=1 ./...) || exit 1
            echo "::endgroup::"
          done

  conformance:
    name: conformance (release gate)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: conformance/go.sum

      - name: start brokers
        run: docker compose -f conformance/docker-compose.yml up -d

      - name: wait for brokers
        timeout-minutes: 2
        run: |
          for port in 1883 1884; do
            until bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; do sleep 1; done
          done

      - name: run conformance
        run: go test -tags conformance -race -timeout 180s ./...
        working-directory: conformance

      - name: stop brokers
        if: always()
        run: docker compose -f conformance/docker-compose.yml down -v

  install:
    name: install from the module proxy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go get every released module in a module outside the repository
        run: scripts/verify-release.sh "${GITHUB_REF_NAME}"

  publish:
    name: publish GitHub release
    needs: [validate, conformance, install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: create release with auto-generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
