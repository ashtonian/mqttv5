name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

env:
  # The oldest Go minor go.mod accepts, at its newest patch: what a
  # supported user builds with, standard-library security fixes included.
  # govulncheck checks the standard library of the Go that runs it.
  GO_VERSION: '1.27.x'

jobs:
  validate:
    name: validate tag
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-mqttv5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@470279e1ff775269324ca13b0aaaf7211951215e # v1.0.1
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go vet and go test -race (every module)
        run: |
          for m in . codec/json codec/msgpack store/file queue/file internal/filedb transport/ws examples benchmarks; do
            echo "::group::$m"
            (cd "$m" && go vet ./... && go test -race -timeout 5m -count=1 ./...) || exit 1
            echo "::endgroup::"
          done
  # The same workflow every push runs, so the release gate cannot drift
  # from it.
  conformance:
    name: conformance (release gate)
    needs: validate
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    uses: ./.github/workflows/conformance.yml
  install:
    name: install from the module proxy
    needs: validate
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-mqttv5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@470279e1ff775269324ca13b0aaaf7211951215e # v1.0.1
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: go get every released module in a module outside the repository
        run: scripts/verify-release.sh "${GITHUB_REF_NAME}"
  publish:
    name: publish GitHub release
    needs: [validate, conformance, install]
    permissions:
      contents: write
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-mqttv5
    steps:
      # The runner image has no gh CLI; github-script runs on the
      # runner's own Node.
      - name: create release with auto-generated notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG;
            // createRelease would make a missing tag from the default
            // branch; the release must be of the tag that was gated.
            await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: tag,
              generate_release_notes: true,
            });
