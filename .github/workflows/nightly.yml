name: nightly

# Long-running checks too slow for every push:
#
#   - the model-based fault-injection tests with a million seeds that
#     change every night (a failure prints its seed; reproduce with
#     MQTTV5_SEED_BASE=<seed> MQTTV5_SEEDS=1);
#   - the conformance suite against mosquitto, EMQX (over every
#     transport) and HiveMQ CE,
#     with the strict-limit tests against a HiveMQ that announces tight
#     CONNACK limits, and a ten-minute connection-cut soak per broker.
#
# The models run every night: their seeds change. The broker suite runs
# only when it has something new to check: a scheduled run skips it when
# it already passed on the same commit (go-ci-actions already-passed).
# A manual run always runs it.

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      soak:
        description: soak duration per broker (Go duration)
        default: 10m

permissions:
  id-token: write
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
  # The oldest Go minor go.mod accepts, at the newest patch the runner's tool
  # cache holds (setup-go downloads only when it holds none): the runner image
  # tracks Go patch releases.
  GO_VERSION: '1.27.x'

jobs:
  history:
    name: broker suite already passed on this commit
    if: github.event_name == 'schedule' && github.actor_id == '4212452'
    permissions:
      actions: read
    runs-on: arc-mqttv5
    timeout-minutes: 5
    outputs:
      passed: ${{ steps.conformance.outputs.passed }}
    steps:
      - id: conformance
        uses: ashtonian/go-ci-actions/already-passed@96bac0922703f6cac14ee796e2e6535794d550ce # v1.11.0
        with:
          jobs: conformance
  models:
    name: model-based tests
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@96bac0922703f6cac14ee796e2e6535794d550ce # v1.11.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: seed base for tonight
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          echo "BASE=$((day * 10000000))" >> "$GITHUB_ENV"

      - name: session engine, 1,000,000 seeds
        run: MQTTV5_SEED_BASE=$BASE MQTTV5_SEEDS=1000000 go test -count=1 -timeout 60m -run '^TestSessionFaultInjection$' ./internal/inflight

      - name: session engine, 50,000 seeds with -race
        run: MQTTV5_SEED_BASE=$((BASE + 5000000)) MQTTV5_SEEDS=50000 go test -race -count=1 -timeout 60m -run '^TestSessionFaultInjection$' ./internal/inflight

      - name: subscriptions, 2,000 seeds with -race
        run: MQTTV5_SEED_BASE=$BASE MQTTV5_SEEDS=2000 go test -race -count=1 -timeout 60m -run '^TestSubscriptionModel$' .
  conformance:
    name: conformance (${{ matrix.broker.name }})
    needs: history
    # !cancelled() runs the suite when history is skipped, as on a manual run.
    if: ${{ !cancelled() && needs.history.outputs.passed != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    # Every leg starts the whole broker stack, up to 13.3Gi (home-ops-private#727).
    runs-on: arc-mqttv5-large
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        broker:
          - { name: mosquitto, url: "mqtt://127.0.0.1:1883", second: "mqtt://127.0.0.1:1884" }
          - { name: emqx, url: "mqtt://127.0.0.1:1884", second: "mqtt://127.0.0.1:1883" }
          - { name: hivemq, url: "mqtt://127.0.0.1:1886", second: "mqtt://127.0.0.1:1883" }
          # The suite over each of EMQX's other transports; the fault-proxy
          # tests and the soak, which read plain MQTT, skip.
          - { name: emqx-mqtts, url: "mqtts://127.0.0.1:8893", second: "mqtt://127.0.0.1:1883" }
          - { name: emqx-ws, url: "ws://127.0.0.1:8083/mqtt", second: "mqtt://127.0.0.1:1883" }
          - { name: emqx-wss, url: "wss://127.0.0.1:8084/mqtt", second: "mqtt://127.0.0.1:1883" }
          - { name: emqx-quic, url: "mqtt-quic://127.0.0.1:14567", second: "mqtt://127.0.0.1:1883" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@96bac0922703f6cac14ee796e2e6535794d550ce # v1.11.0
        with:
          workload: ${{ toJSON(matrix) }}
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: conformance/go.sum

      - name: start brokers
        run: docker compose -f conformance/docker-compose.yml --profile hivemq up -d --wait

      # Every 15 s, each broker's memory as its cgroup counts it. The
      # runner's Docker root is a tmpfs, so that includes the files a
      # broker writes, preallocated space too, which docker's own size
      # reports leave out.
      - name: sample broker memory
        run: |
          docker system df > "$RUNNER_TEMP/broker-memory.log"
          (while sleep 15; do
            echo "== $(date -u +%T)"
            docker stats --no-stream --format '{{.Name}} mem={{.MemUsage}} cpu={{.CPUPerc}}'
          done) >> "$RUNNER_TEMP/broker-memory.log" 2>&1 &

      - name: wait for the emqx-scram REST API
        timeout-minutes: 2
        run: |
          until curl -fsS -o /dev/null \
            -u conformancekey:conformanceSecret0123456789 \
            http://127.0.0.1:18084/api/v5/authentication; do
            sleep 2
          done

      - name: run conformance
        env:
          MQTT_BROKER: ${{ matrix.broker.url }}
          MQTT_BROKER_2: ${{ matrix.broker.second }}
          MQTTV5_SOAK: ${{ inputs.soak || '10m' }}
          # Records the soak's packets, so a broker's fault is told from
          # the client's (conformance/README.md, Broker notes).
          MQTTV5_SOAK_TRACE: "1"
        run: go test -tags conformance -race -count=1 -v -timeout 45m ./...
        working-directory: conformance

      - name: broker logs (on failure)
        if: failure()
        run: |
          docker compose -f conformance/docker-compose.yml --profile hivemq ps --all --quiet \
            | xargs docker inspect --format '{{.Name}} {{.State.Status}} exit={{.State.ExitCode}} oom-killed={{.State.OOMKilled}}'
          docker compose -f conformance/docker-compose.yml --profile hivemq logs --no-color

      - uses: ashtonian/go-ci-actions/upload-artifact@96bac0922703f6cac14ee796e2e6535794d550ce # v1.11.0
        if: always()
        with:
          name: broker-memory-${{ matrix.broker.name }}
          path: ${{ runner.temp }}/broker-memory.log

      - name: stop brokers
        if: always()
        run: docker compose -f conformance/docker-compose.yml --profile hivemq down -v
