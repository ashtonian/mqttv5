name: Artifact storage
# The pull request that changes CI checks the runner's artifact access; the
# push that merges it would repeat the same check on the same runners.
on:
  pull_request:
    paths: ['.github/**', 'scripts/ci-acceptance.py', 'tools/ci_acceptance.py', 'tools/testinventory/**']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: artifact-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ashtonian/go-ci-actions/.github/workflows/artifact-consumer.yml@96bac0922703f6cac14ee796e2e6535794d550ce # v1.11.0
    with:
      runner: arc-mqttv5
    secrets:
      CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
