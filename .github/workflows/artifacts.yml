name: Artifact storage
on:
  push:
    branches: [master]
    paths: ['.github/**', 'scripts/ci-acceptance.py', 'tools/ci_acceptance.py', 'tools/testinventory/**']
  pull_request:
    paths: ['.github/**', 'scripts/ci-acceptance.py', 'tools/ci_acceptance.py', 'tools/testinventory/**']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
defaults:
  run:
    shell: bash
concurrency:
  group: artifact-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ashtonian/go-ci-actions/.github/workflows/artifact-consumer.yml@fd722a57af04549dc44eeb876c53c72da97d7faf # v1.5.0
    with:
      runner: arc-mqttv5
