name: bench-codec

# Codec micro-benchmarks on every push to main and every PR that touches
# the codec or its consumers. A push records the full sweep in the
# history on the gh-pages branch, rendered as a live chart at
# https://<owner>.github.io/<repo>/dev/bench/ — see benchmarks/README.md
# for the dashboard URL and the one-time GH Pages enablement step. A PR
# runs one short sample per benchmark for the comparison comment.
#
# The end-to-end benchmarks vs autopaho live in bench.yml and stay
# manual (workflow_dispatch) because they're slow, need mosquitto, and
# show too much loop variance for automated regression alerts.

on:
  push:
    branches: [main, master]
    paths:
      - 'wire/**'
      - 'benchmarks/codec_bench_test.go'
      - 'benchmarks/fixtures.go'
      - 'benchmarks/go.mod'
      - 'benchmarks/go.sum'
      - '.github/workflows/bench-codec.yml'
  pull_request:
    paths:
      - 'wire/**'
      - 'benchmarks/codec_bench_test.go'
      - 'benchmarks/fixtures.go'
      - 'benchmarks/go.mod'
      - 'benchmarks/go.sum'
      - '.github/workflows/bench-codec.yml'

concurrency:
  group: bench-codec-${{ github.workflow }}-${{ github.ref }}
  # Cancel duplicate PR runs to save CI minutes. Never cancel a push
  # to main — every commit's bench result should land in history.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write       # push appended history to gh-pages (push-to-main only)
  pull-requests: write  # post comparison comments on PRs

env:
  # The oldest Go minor go.mod accepts, at the newest patch the runner's tool
  # cache holds (setup-go downloads only when it holds none): the runner image
  # tracks Go patch releases.
  GO_VERSION: '1.27.x'

jobs:
  bench-codec:
    name: codec micro benchmarks (track + alert)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: write       # push appended history to gh-pages (push-to-main only)
      pull-requests: write  # post comparison comments on PRs
      id-token: write
    runs-on: arc-mqttv5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: benchmarks/go.sum

      - name: run codec benchmarks
        # The history takes five 2 s samples per benchmark for stable
        # medians: about 15 minutes on arc-mqttv5. A PR takes one 500 ms
        # sample, a twentieth of the benchmark time, which is enough for
        # the comment to flag a 1.5x regression; the push that merges it
        # records the full sweep.
        env:
          BENCH_FLAGS: ${{ github.event_name == 'push' && '-benchtime=2s -count=5' || '-benchtime=500ms -count=1' }}
        run: |
          read -r -a flags <<<"$BENCH_FLAGS"
          go test -bench='^Benchmark(Decode|Encode)' -run=^$ -benchmem \
            "${flags[@]}" ./... | tee bench.out
        working-directory: benchmarks

      - name: check for benchmark history
        id: history
        # The history lives on the gh-pages branch, which the repository
        # owner creates once (benchmarks/README.md, "In CI"). Without it
        # the benchmarks still run; they are not tracked.
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No gh-pages branch, so codec results are not tracked; see benchmarks/README.md, In CI."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: track history + alert on regression
        if: steps.history.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          tool: 'go'
          output-file-path: benchmarks/bench.out
          # Where the JSON history + Chart.js dashboard live.
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: 'dev/bench'
          # Compare each metric against the latest committed entry.
          # 150% = a 1.5× slowdown trips an alert. Tight enough to catch
          # real regressions, loose enough to ride out the ~20 % noise
          # we see on GH shared runners.
          alert-threshold: '150%'
          fail-on-alert: false
          # PR runs: always post a comment so reviewers see the diff
          # inline; persist nothing.
          # Push to main: append to history, comment only on alert.
          comment-always: ${{ github.event_name == 'pull_request' }}
          comment-on-alert: true
          auto-push: ${{ github.event_name == 'push' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
