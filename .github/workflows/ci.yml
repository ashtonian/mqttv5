name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The oldest Go minor go.mod accepts, at its newest patch: what a
  # supported user builds with, standard-library security fixes included.
  # govulncheck checks the standard library of the Go that runs it.
  GO_VERSION: '1.27.x'
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  lint:
    name: lint (${{ matrix.module }})
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - codec/json
          - codec/msgpack
          - store/file
          - queue/file
          - internal/filedb
          - transport/ws
          - examples
          - conformance
          - benchmarks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@78710c0215622d4dd362f4c565de788934051488 # v1.1.0
        with:
          workload: ${{ toJSON(matrix) }}
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
  test:
    name: tidy, vet and test (${{ matrix.module }})
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - codec/json
          - codec/msgpack
          - store/file
          - queue/file
          - internal/filedb
          - transport/ws
          - examples
          - benchmarks
          - conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@78710c0215622d4dd362f4c565de788934051488 # v1.1.0
        with:
          workload: ${{ toJSON(matrix) }}
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Verify module dependencies
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet untagged packages
        if: matrix.module != 'conformance'
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Vet tagged packages
        working-directory: ${{ matrix.module }}
        run: go vet -tags 'conformance e2e smoke' ./...
      - name: go test -race
        if: matrix.module != 'conformance'
        run: go test -race -v -timeout 5m -count=1 -coverprofile=coverage.out ./...
        working-directory: ${{ matrix.module }}

      # Informational, not a gate.
      - name: coverage summary
        if: always() && matrix.module != 'conformance'
        run: |
          if [ -f coverage.out ]; then
            echo "### Coverage (${{ matrix.module }}): $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: ${{ matrix.module }}
  build:
    name: build
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@78710c0215622d4dd362f4c565de788934051488 # v1.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: build core
        run: go build ./...

      - name: build examples
        run: go build ./...
        working-directory: examples
  vuln:
    name: vulnerability scans (all modules)
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@78710c0215622d4dd362f4c565de788934051488 # v1.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Scan every module
        run: |
          for module in . codec/json codec/msgpack store/file queue/file internal/filedb transport/ws examples conformance benchmarks; do
            echo "Scanning $module"
            (cd "$module" && govulncheck ./...)
          done
