name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI_ARTIFACT_ENDPOINT: ${{ secrets.CI_ARTIFACT_ENDPOINT }}
  # The oldest Go minor go.mod accepts. Lint and tests take the newest patch
  # the runner's tool cache holds; the vulnerability scan resolves the newest
  # released patch (see the build job).
  GO_VERSION: '1.27.x'
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.8.0

# Every module go.work uses is linted, tested and scanned by one job each
# (scripts/each-module.sh): per-module jobs spent most of their time on runner
# start-up and setup. The push that merges a pull request reuses that pull
# request's validation of the same tree (go-ci-actions acceptance) instead of
# running it again.
jobs:
  acceptance:
    name: reuse pull request validation
    if: github.event_name == 'push' && github.actor_id == '4212452'
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on: arc-mqttv5
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: verify
        uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: verify
          variables: ${{ toJSON(vars) }}
  lint:
    name: lint (every module)
    needs: acceptance
    # !cancelled() runs the job when acceptance is skipped, as on pull requests.
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - name: golangci-lint every module
        run: scripts/each-module.sh golangci-lint run
  test:
    name: tidy, vet and test (every module)
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Tidy, vet and race-test every module
        run: scripts/each-module.sh "$PWD/scripts/test-module.sh"
  build:
    name: build and vulnerability scan (every module)
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' && github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # govulncheck checks the standard library of the Go that runs it, so
      # this job resolves the newest released patch, what a supported user
      # builds with, rather than the one the runner image carries.
      - uses: ashtonian/go-ci-actions@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Build every module
        run: scripts/each-module.sh go build ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: Scan every module
        run: scripts/each-module.sh govulncheck ./...
  # The release gate calls the same workflow.
  conformance:
    name: conformance
    needs: acceptance
    if: ${{ !cancelled() && needs.acceptance.outputs.reused != 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/conformance.yml
  accepted:
    name: record validation
    needs: [lint, test, build, conformance]
    # Without a status function this runs only when every need succeeded.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ashtonian/go-ci-actions/acceptance@4425a5fdd39bd4f2fba5be7ee71314b145a6e591 # v1.8.0 candidate (go-ci-actions#18)
        with:
          mode: record
          results: ${{ toJSON(needs) }}
          variables: ${{ toJSON(vars) }}
