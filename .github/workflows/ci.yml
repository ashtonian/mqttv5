name: ci

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The oldest Go minor go.mod accepts, at its newest patch: what a
  # supported user builds with, standard-library security fixes included.
  # govulncheck checks the standard library of the Go that runs it.
  GO_VERSION: '1.26.x'
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  lint:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - codec/json
          - codec/msgpack
          - store/file
          - queue/file
          - internal/filedb
          - transport/ws
          - examples
          - conformance
          - benchmarks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}

  tidy:
    name: tidy (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - codec/json
          - codec/msgpack
          - store/file
          - queue/file
          - internal/filedb
          - transport/ws
          - examples
          - conformance
          - benchmarks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go mod tidy
        run: go mod tidy
        working-directory: ${{ matrix.module }}

      - name: verify go.mod / go.sum unchanged
        run: |
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go mod tidy produced changes in ${{ matrix.module }}; commit them."
            exit 1
          fi
        working-directory: ${{ matrix.module }}

  vet:
    name: vet (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - codec/json
          - codec/msgpack
          - store/file
          - queue/file
          - internal/filedb
          - transport/ws
          - examples
          - conformance
          - benchmarks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go vet (untagged)
        if: matrix.module != 'conformance'
        run: go vet ./...
        working-directory: ${{ matrix.module }}

      - name: go vet (with build tags)
        run: go vet -tags 'conformance e2e' ./...
        working-directory: ${{ matrix.module }}

  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - codec/json
          - codec/msgpack
          - store/file
          - queue/file
          - internal/filedb
          - transport/ws
          - examples
          - benchmarks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go test -race
        run: go test -race -v -timeout 5m -count=1 -coverprofile=coverage.out ./...
        working-directory: ${{ matrix.module }}

      # Informational, not a gate.
      - name: coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            echo "### Coverage (${{ matrix.module }}): $(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')" >> "$GITHUB_STEP_SUMMARY"
          fi
        working-directory: ${{ matrix.module }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: build core
        run: go build ./...

      - name: build examples
        run: go build ./...
        working-directory: examples

  vuln:
    name: vuln (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - codec/json
          - codec/msgpack
          - store/file
          - queue/file
          - internal/filedb
          - transport/ws
          - examples
          - conformance
          - benchmarks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}

      - name: govulncheck
        run: govulncheck ./...
        working-directory: ${{ matrix.module }}
