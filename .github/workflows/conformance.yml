name: conformance

# Called by ci.yml on every push and pull request, and by the release gate on
# the tagged commit. The caller owns concurrency.
on:
  workflow_call:

permissions:
  contents: read

env:
  # The oldest Go minor go.mod accepts, at the newest patch the runner's tool
  # cache holds (setup-go downloads only when it holds none): the runner image
  # tracks Go patch releases.
  GO_VERSION: '1.27.x'

jobs:
  conformance:
    name: broker-backed conformance suite
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      id-token: write
    runs-on: arc-mqttv5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ashtonian/go-ci-actions@4404b5c0617f86383381bd07ca8a72eeb11863df # v1.10.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: conformance/go.sum

      # --wait returns once every broker's healthcheck passes. A port that
      # accepts a TCP connection is not a broker that is ready: EMQX
      # resets connections until it has started.
      - name: start brokers
        run: docker compose -f conformance/docker-compose.yml up -d --wait --wait-timeout 300

      - name: wait for emqx-scram REST API
        timeout-minutes: 2
        run: |
          until curl -fsS -o /dev/null \
            -u conformancekey:conformanceSecret0123456789 \
            http://127.0.0.1:18084/api/v5/authentication; do
            echo "waiting for emqx-scram API"
            sleep 2
          done
          echo "emqx-scram API ready"

      - name: run conformance
        run: go test -tags conformance -race -v -timeout 180s ./...
        working-directory: conformance

      - name: run the examples
        run: go test -tags smoke -v -timeout 300s -run TestExamplesRun .
        working-directory: examples

      - name: broker logs (on failure)
        if: failure()
        run: docker compose -f conformance/docker-compose.yml logs --no-color

      - name: stop brokers
        if: always()
        run: docker compose -f conformance/docker-compose.yml down -v
