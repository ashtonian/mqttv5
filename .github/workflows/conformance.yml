name: conformance

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The oldest Go minor go.mod accepts, at its newest patch: what a
  # supported user builds with, standard-library security fixes included.
  # govulncheck checks the standard library of the Go that runs it.
  GO_VERSION: '1.27.x'

jobs:
  conformance:
    name: broker-backed conformance suite
    if: github.actor_id == '4212452' && (github.event_name != 'pull_request' || (github.event.pull_request.user.id == 4212452 && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: arc-mqttv5
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go-cache
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache-dependency-path: conformance/go.sum

      - name: start brokers
        run: docker compose -f conformance/docker-compose.yml up -d

      - name: wait for brokers
        timeout-minutes: 2
        run: |
          for port in 1883 1884 1885 8083 18084; do
            echo "waiting for tcp/$port"
            until bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; do
              sleep 1
            done
            echo "tcp/$port up"
          done

      - name: wait for emqx-scram REST API
        timeout-minutes: 2
        run: |
          until curl -fsS -o /dev/null \
            -u conformancekey:conformanceSecret0123456789 \
            http://127.0.0.1:18084/api/v5/authentication; do
            echo "waiting for emqx-scram API"
            sleep 2
          done
          echo "emqx-scram API ready"

      - name: run conformance
        run: go test -tags conformance -race -v -timeout 180s ./...
        working-directory: conformance

      - name: run the examples
        run: go test -tags smoke -v -timeout 300s -run TestExamplesRun .
        working-directory: examples

      - name: broker logs (on failure)
        if: failure()
        run: docker compose -f conformance/docker-compose.yml logs --no-color

      - name: stop brokers
        if: always()
        run: docker compose -f conformance/docker-compose.yml down -v
      - name: Trim Go build cache
        uses: ./.github/actions/trim-go-cache
