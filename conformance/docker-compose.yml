# Every broker has a memory limit, so one that grows past it is killed
# alone (docker inspect shows OOMKilled) instead of exhausting the Docker
# daemon's memory and taking the other brokers and the CI runner with it.

x-hivemq: &hivemq
  image: hivemq/hivemq-ce:2026.5
  profiles: ["hivemq"]
  mem_limit: 3g
  environment:
    - HIVEMQ_LOG_LEVEL=WARN
    # The image's own options, and half the memory limit for the heap: the
    # rest is Netty's direct buffers, metaspace and thread stacks.
    - JAVA_OPTS=-XX:+UnlockExperimentalVMOptions -XX:+UseNUMA -XX:MaxRAMPercentage=50
  healthcheck:
    test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/1883'"]
    interval: 3s
    timeout: 2s
    retries: 40

services:
  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    container_name: mqttv5-conformance-mosquitto
    mem_limit: 256m
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15

  # emqx covers the cases mosquitto handles differently (e.g.,
  # AssignedClientIdentifier policy, shared subscriptions).
  emqx:
    image: emqx/emqx:6.3.1
    container_name: mqttv5-conformance-emqx
    mem_limit: 1536m
    ports:
      - "127.0.0.1:1884:1883"
      - "127.0.0.1:8083:8083" # WebSocket listener, for the ws example
    environment:
      - EMQX_ALLOW_ANONYMOUS=true
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 15

  # emqx-scram is a dedicated EMQX with MQTT 5 enhanced authentication
  # (SCRAM-SHA-256) for the re-authentication conformance test, kept
  # separate from the anonymous `emqx` above so the other emqx-backed
  # tests stay unaffected. The SCRAM authenticator and its user are
  # provisioned at test time via the REST API (see reauth_test.go), using
  # the API key bootstrapped from ./emqx/api_key.bootstrap.
  emqx-scram:
    image: emqx/emqx:6.3.1
    container_name: mqttv5-conformance-emqx-scram
    mem_limit: 1536m
    ports:
      - "127.0.0.1:1885:1883"   # MQTT listener (SCRAM-authenticated)
      - "127.0.0.1:18084:18083" # REST API, for provisioning the SCRAM user
    environment:
      - EMQX_API_KEY__BOOTSTRAP_FILE=/opt/emqx/etc/api_key.bootstrap
    volumes:
      - ./emqx/api_key.bootstrap:/opt/emqx/etc/api_key.bootstrap:ro
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 15

  # HiveMQ CE runs in the nightly conformance job, not on every
  # push: start it with `docker compose --profile hivemq up -d`.
  # `hivemq` keeps the defaults (Receive Maximum 10, five topic aliases)
  # and runs the whole suite; `hivemq-strict` announces tight limits for
  # strict_test.go. Both keep their persistence in memory (see
  # hivemq/default.xml).
  hivemq:
    <<: *hivemq
    container_name: mqttv5-conformance-hivemq
    ports:
      - "127.0.0.1:1886:1883"
    volumes:
      - ./hivemq/default.xml:/opt/hivemq/conf/config.xml:ro

  hivemq-strict:
    <<: *hivemq
    container_name: mqttv5-conformance-hivemq-strict
    ports:
      - "127.0.0.1:1887:1883"
    volumes:
      - ./hivemq/strict.xml:/opt/hivemq/conf/config.xml:ro
