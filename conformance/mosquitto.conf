# mqttv5 conformance broker config: mosquitto with permissive defaults
# for client-side conformance testing. Production setups should not
# enable allow_anonymous.

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

# Generous timeouts so the conformance suite's "broker drop" tests
# don't race the broker's own house-keeping.
persistent_client_expiration 1h
max_keepalive 65535

# Larger payload limit so we can test 16 KiB+ publishes.
message_size_limit 1048576

# Allow retained messages (some conformance tests use them).
retain_available true

# Allow wildcard subscriptions and topic aliases (MQTT v5 features
# we exercise).
allow_zero_length_clientid true
